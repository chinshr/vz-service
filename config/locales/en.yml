# Files in the config/locales directory are used for internationalization
# and are automatically loaded by Rails. If you want to use locales other
# than English, add the necessary files in this directory.
#
# To use the locales, use `I18n.t`:
#
#     I18n.t 'hello'
#
# In views, this is aliased to just `t`:
#
#     <%= t('hello') %>
#
# To use a different locale, set it with `I18n.locale`:
#
#     I18n.locale = :es
#
# This would use the information in config/locales/es.yml.
#
# To learn more, please read the Rails Internationalization guide
# available at http://guides.rubyonrails.org/i18n.html.

en:
  hello: "Hello world"

  devise:
    registrations:
      user:
        updated: "Successfully updated."
        not_updated: "Changes were not saved."
        update_needs_confirmation: "Confirmation password required."

  lib:
    model:
      aasm_support:
        status: "cannot transition from state '%{current_state}'"

  api:
    error_code:
      authorization_error:
        generic: "Authorization error"
        access_token: "Authorization error: access_token"
        platform: "Authorization error: platform"
        user: "Authorization error: user"
        max_number_of_device_authorizations_allowed: "Maximum number of device authorizations reached"
        max_number_of_device_authorizations_allowed_per_period: "Maximum number of device authorizations reached within the past %{days} days"
      argument_missing_name: "Argument missing '%{argument_name}'"
  activerecord:
    models:
      mechanical_turk:
        create_hit_title: "Transcribe up to 25 Seconds of %{language} audio to text - Earn up to $0.12 per HIT!"
        create_hit_description: "Press PLAY and type the words that you hear then press ENTER or Submit."
    errors:
      messages:
        registration: "has not yet been accepted to the beta program"
      models:
        upload:
          attributes:
            file_type:
              audio_expected: "is not an accepted audio file"
              video_expected: "is not an accepted video file"
        user:
          attributes:
            email:
              register_email: "has not registered"
              email_format: "invalid format"
            username:
              username_format: "invalid format"
        registration:
          attributes:
            email:
              blank: "we need a valid email address"
              taken: "has already registered"
              email_format: "not a valid email address"
